name: driver lab (QEMU arm64, no board)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Force a kernel version like 7.3.1 (blank = newest stable release)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "drivers/**"
      - "rootfs/**"
      - "scripts/**"
      - "dts/**"
      - "Makefile"
      - ".github/workflows/driver-lab.yml"
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_KERNEL_VERSION: ${{ inputs.kernel_version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOOT_TIMEOUT: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain, QEMU, dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex ca-certificates curl git \
            libssl-dev libelf-dev device-tree-compiler cpio xz-utils python3 kmod \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-system-arm

      - name: Toolchain and disk
        run: |
          # awk, not `sed -n 1p`: sed stops reading and the tool dies of SIGPIPE.
          aarch64-linux-gnu-gcc --version | awk 'NR == 1'
          qemu-system-aarch64 --version | awk 'NR == 1'
          dtc --version | awk 'NR == 1'
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: Resolve and download sources
        run: make fetch

      - name: Configure kernel and prepare for modules
        run: make prepare

      - name: Build initramfs with hello_demo.ko
        run: make initramfs

      - name: Patch the QEMU device tree
        run: make dtb

      - name: Show the injected node
        run: dtc -I dtb -O dts work/virt-hello.dtb | sed -n '/hello-demo/,/};/p'

      - name: Build kernel Image (initramfs embedded)
        run: make kernel

      - name: Boot headless in QEMU
        # Whether QEMU exited cleanly is not the verdict; the assertions below are.
        continue-on-error: true
        run: make boot

      - name: Assert driver results
        if: always()
        run: make check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-arm64-boot
          path: |
            work/boot.log
            work/initramfs.cpio.gz
            work/virt-hello.dtb
            work/virt-hello.dts
          if-no-files-found: warn
