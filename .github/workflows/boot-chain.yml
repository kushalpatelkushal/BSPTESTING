name: boot chain (TF-A + U-Boot -> Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Everything this job actually boots. rootfs/init, dts/ and drivers/ are here
    # because the chain loads the same Image with the same initramfs and the same
    # patched DTB as the driver lab: when they were missing, the /dev/console fix
    # proved up in the driver lab and this job stayed stale and red.
    paths:
      - "scripts/build-chain.sh"
      - "scripts/boot-chain.sh"
      - "scripts/make-disk.sh"
      - "scripts/make-dtb.sh"
      - "scripts/build-kernel.sh"
      - "scripts/build-initramfs.sh"
      - "scripts/fetch-sources.sh"
      - "rootfs/**"
      - "dts/**"
      - "drivers/**"
      - ".github/workflows/boot-chain.yml"
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The boot-chain job tracks mainline U-Boot and TF-A, so it is allowed to go
    # red without taking the driver lab down with it.
    continue-on-error: true
    env:
      # 300s, not 900s: U-Boot answers at ~60s and Linux takes under a minute more,
      # so a run that has not printed its Result: lines by now is not going to.
      # A shorter timeout makes a red round cheap instead of burning 15 idle minutes.
      BOOT_TIMEOUT: 300
      BOOT_DELAY: 60
      # fetch-sources.sh resolves the kernel from the GitHub API; runners share an
      # egress IP and the anonymous limit is easy to hit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain, QEMU, dtc, mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex ca-certificates curl git swig python3 \
            libssl-dev libelf-dev device-tree-compiler cpio xz-utils \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-system-arm \
            dosfstools mtools u-boot-tools

      - name: Build kernel, initramfs and patched DTB
        run: make all

      - name: Build virtio FAT disk
        run: make disk

      - name: Build U-Boot (BL33) and ARM Trusted Firmware
        run: make chain-build

      - name: Run the full chain in QEMU
        run: make chain-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-chain-log
          path: |
            work/chain.log
            work/chain.env
          if-no-files-found: warn
